<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impulso — Galería de Posts</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --naranja: #ff7903; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Libre Franklin', sans-serif; background: #fff; color: #1a1a1a; }
  header { background: var(--naranja); padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { color: #fff; font-size: 18px; font-weight: 800; }
  header span { color: rgba(255,255,255,0.8); font-size: 12px; }
  .tabs { display: flex; padding: 0 28px; border-bottom: 1.5px solid #eee; background: #fff; position: sticky; top: 0; z-index: 10; }
  .tab { padding: 13px 18px; font-size: 11px; font-weight: 600; color: #888; cursor: pointer; border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: 0.5px; }
  .tab.active { color: var(--naranja); border-bottom-color: var(--naranja); }
  .section { display: none; padding: 20px 28px; }
  .section.active { display: block; }
  .summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; margin-bottom: 20px; }
  .kpi { background: #fafafa; border-radius: 10px; padding: 12px 14px; }
  .kpi-val { font-size: 20px; font-weight: 800; color: var(--naranja); }
  .kpi-label { font-size: 10px; color: #888; margin-top: 2px; }
  .sec-title { font-size: 11px; font-weight: 700; color: var(--naranja); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 14px; }
  .card { background: #fff; border: 0.5px solid #e8e8e8; border-radius: 12px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
  .card-img { height: 160px; background: #f5f5f3; position: relative; overflow: hidden; }
  .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fallback { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; background: linear-gradient(135deg,#fff8f3,#ffe8d6); font-size: 11px; color: #888; text-align: center; padding: 14px; line-height: 1.5; }
  .ptag { position: absolute; top: 8px; right: 8px; font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 20px; letter-spacing: 0.5px; }
  .pli { background: #e8f0fb; color: #1a56a0; }
  .pig { background: #fde8f0; color: #b5154e; }
  .card-body { padding: 12px 14px; }
  .card-title { font-size: 12px; font-weight: 700; color: #1a1a1a; margin-bottom: 3px; line-height: 1.4; }
  .card-date { font-size: 10px; color: #999; margin-bottom: 10px; }
  .metrics { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-bottom: 10px; }
  .met { text-align: center; }
  .met-val { font-size: 14px; font-weight: 700; color: var(--naranja); }
  .met-lbl { font-size: 9px; color: #999; text-transform: uppercase; margin-top: 1px; }
  .card-link { display: block; text-align: center; font-size: 10px; font-weight: 600; color: var(--naranja); text-decoration: none; padding: 6px; border: 1px solid #ffe0c2; border-radius: 6px; }
  .card-link:hover { background: #fff3eb; }
</style>
</head>
<body>
<header>
  <h1>Impulso — Galería de Posts</h1>
  <span>Rendimiento por plataforma</span>
</header>
<div class="tabs">
  <div class="tab active" onclick="showTab('todos',this)">Todos</div>
  <div class="tab" onclick="showTab('li-propel',this)">LinkedIn Propel</div>
  <div class="tab" onclick="showTab('instagram',this)">Instagram</div>
  <div class="tab" onclick="showTab('claudia',this)">Clau</div>
  <div class="tab" onclick="showTab('mafe',this)">Mafe</div>
</div>
<div id="todos" class="section active"><div class="summary" id="sum-todos"></div><div class="sec-title">Todos los posts</div><div class="grid" id="grid-todos"></div></div>
<div id="li-propel" class="section"><div class="summary" id="sum-li"></div><div class="sec-title">LinkedIn Propel</div><div class="grid" id="grid-li"></div></div>
<div id="instagram" class="section"><div class="summary" id="sum-ig"></div><div class="sec-title">Instagram</div><div class="grid" id="grid-ig"></div></div>
<div id="claudia" class="section"><div class="summary" id="sum-clau"></div><div class="sec-title">Claudia LinkedIn</div><div class="grid" id="grid-clau"></div></div>
<div id="mafe" class="section"><div class="summary" id="sum-mafe"></div><div class="sec-title">Mafe LinkedIn</div><div class="grid" id="grid-mafe"></div></div>

<script>

    { titulo:"Cuando el propósito no es suficiente — Diego Ontaneda", fecha:"Mar 26, 2026", imp:1157, clics:22, tasa:4.0, url:"https://www.linkedin.com/feed/update/urn:li:activity:7442966320377294848", img:I["proposito"] },
    { titulo:"De Mejorar a Crecer — Clau", fecha:"Mar 5, 2026", imp:803, clics:19, tasa:3.2, url:"https://www.linkedin.com/feed/update/urn:li:activity:7435426956981981185", img:I["mejorar"] },
    { titulo:"No puedes hacerlo todo — Mafe", fecha:"Feb 17, 2026", imp:926, clics:38, tasa:6.9, url:"https://www.linkedin.com/feed/update/urn:li:activity:7429588830732574722", img:I["no-puedes"] },
    { titulo:"Liderar con intención — Clau", fecha:"Jan 29, 2026", imp:1264, clics:77, tasa:8.2, url:"https://www.linkedin.com/feed/update/urn:li:activity:7422656090707845120", img:I["liderar"] },
    { titulo:"De demostrar a compartir — Clau", fecha:"Dec 16, 2025", imp:695, clics:26, tasa:7.3, url:"https://www.linkedin.com/feed/update/urn:li:activity:7406749552281812992", img:I["demostrar"] },
    { titulo:"Atreviéndonos a usar nuestra voz — Clau y Mafe", fecha:"Dec 4, 2025", imp:849, clics:259, tasa:31.8, url:"https://www.linkedin.com/feed/update/urn:li:activity:7402477701980135424", img:I["atreviendonos"] },
    { titulo:"¡Lanzamos Impulso!", fecha:"Dec 2, 2025", imp:783, clics:207, tasa:29.6, url:"https://www.linkedin.com/feed/update/urn:li:activity:7401658863223087106", img:I["lanzamiento"] },
  ],
  ig: [
    { titulo:"No cedas quién eres por un sí — Mafe", fecha:"May 28, 2026", viz:935, alcance:354, likes:23, guardados:6, url:"https://www.instagram.com/p/DY43Q5BDg0I/", img:I["no-cedas"] },

    { titulo:"De Mejorar a Crecer — Clau", fecha:"Mar 5, 2026", viz:855, alcance:342, likes:17, guardados:1, url:"https://www.instagram.com/p/DVhEeccjnYd/", img:I["mejorar"] },

    { titulo:"No puedes hacerlo todo", fecha:"Feb 17, 2026", likes:112, com:28, comp:3, total:143, url:"https://www.linkedin.com/posts/mariafernandasierraperea_carrusel-no-puedes-hacerlo-todo-activity-7429922949056569344-G3MR", img:I["no-puedes"] },

    { titulo:"No cedas quién eres por un sí", fecha:"May 28, 2026", likes:26, com:4, comp:3, total:33, url:"https://www.linkedin.com/posts/mariafernandasierraperea_impulso-claridad-activity-7466178273534771200-nT09", img:I["no-cedas"] },

};

function img(src, alt) { return '<img src="'+src+'" alt="'+alt+'" onerror="this.outerHTML=\'<div class=fallback>'+alt+'</div>\'">'; }
function cardLI(p) { return '<div class="card"><div class="card-img">'+img(p.img,p.titulo)+'<span class="ptag pli">LinkedIn Propel</span></div><div class="card-body"><div class="card-title">'+p.titulo+'</div><div class="card-date">'+p.fecha+'</div><div class="metrics"><div class="met"><div class="met-val">'+p.imp.toLocaleString()+'</div><div class="met-lbl">Imp.</div></div><div class="met"><div class="met-val">'+p.clics+'</div><div class="met-lbl">Clics</div></div><div class="met"><div class="met-val">'+p.tasa+'%</div><div class="met-lbl">Inter.</div></div></div><a href="'+p.url+'" target="_blank" class="card-link">Ver post →</a></div></div>'; }
function cardIG(p) { return '<div class="card"><div class="card-img">'+img(p.img,p.titulo)+'<span class="ptag pig">Instagram</span></div><div class="card-body"><div class="card-title">'+p.titulo+'</div><div class="card-date">'+p.fecha+'</div><div class="metrics"><div class="met"><div class="met-val">'+p.alcance+'</div><div class="met-lbl">Alcance</div></div><div class="met"><div class="met-val">'+p.likes+'</div><div class="met-lbl">Likes</div></div><div class="met"><div class="met-val">'+p.guardados+'</div><div class="met-lbl">Guard.</div></div></div><a href="'+p.url+'" target="_blank" class="card-link">Ver post →</a></div></div>'; }
function cardP(p,label,cls) { return '<div class="card"><div class="card-img">'+img(p.img,p.titulo)+'<span class="ptag '+cls+'">'+label+'</span></div><div class="card-body"><div class="card-title">'+p.titulo+'</div><div class="card-date">'+p.fecha+'</div><div class="metrics"><div class="met"><div class="met-val">'+p.likes+'</div><div class="met-lbl">Likes</div></div><div class="met"><div class="met-val">'+p.com+'</div><div class="met-lbl">Com.</div></div><div class="met"><div class="met-val">'+p.total+'</div><div class="met-lbl">Total</div></div></div><a href="'+p.url+'" target="_blank" class="card-link">Ver post →</a></div></div>'; }
function kpi(label,val) { return '<div class="kpi"><div class="kpi-val">'+val+'</div><div class="kpi-label">'+label+'</div></div>'; }

function render(gId,sId,html,sum) { document.getElementById(gId).innerHTML=html; document.getElementById(sId).innerHTML=sum; }

render('grid-li','sum-li', posts.li.map(cardLI).join(''),
  kpi('Posts',posts.li.length)+kpi('Impresiones',posts.li.reduce((a,p)=>a+p.imp,0).toLocaleString())+kpi('Clics',posts.li.reduce((a,p)=>a+p.clics,0))+kpi('% Inter. prom.',(posts.li.reduce((a,p)=>a+p.tasa,0)/posts.li.length).toFixed(1)+'%'));
render('grid-ig','sum-ig', posts.ig.map(cardIG).join(''),
  kpi('Posts',posts.ig.length)+kpi('Alcance',posts.ig.reduce((a,p)=>a+p.alcance,0).toLocaleString())+kpi('Likes',posts.ig.reduce((a,p)=>a+p.likes,0))+kpi('Guardados',posts.ig.reduce((a,p)=>a+p.guardados,0)));
render('grid-clau','sum-clau', posts.clau.map(p=>cardP(p,'Clau LinkedIn','pli')).join(''),
  kpi('Posts',posts.clau.length)+kpi('Interacciones',posts.clau.reduce((a,p)=>a+p.total,0))+kpi('Top post','Lanzamos Impulso'));
render('grid-mafe','sum-mafe', posts.mafe.map(p=>cardP(p,'Mafe LinkedIn','pli')).join(''),
  kpi('Posts',posts.mafe.length)+kpi('Interacciones',posts.mafe.reduce((a,p)=>a+p.total,0))+kpi('Top post','No puedes hacerlo todo'));
const all=[...posts.li.map(cardLI),...posts.ig.map(cardIG),...posts.clau.map(p=>cardP(p,'Clau LinkedIn','pli')),...posts.mafe.map(p=>cardP(p,'Mafe LinkedIn','pli'))];
render('grid-todos','sum-todos', all.join(''),
  kpi('Posts totales',posts.li.length+posts.ig.length+posts.clau.length+posts.mafe.length)+kpi('Plataformas',3)+kpi('Mejor LI','Liderar con intención')+kpi('Mejor IG','No cedas quién eres'));

function showTab(id,el) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
}
</script>
</body>
</html>

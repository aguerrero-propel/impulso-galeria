<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impulso — Galería de Posts</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --naranja: #ff7903;
    --rojo: #ff4812;
    --blanco: #ffffff;
    --gris-claro: #f8f8f6;
    --gris-texto: #555;
    --gris-oscuro: #1a1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Libre Franklin', sans-serif; background: var(--blanco); color: var(--gris-oscuro); }

  header { background: var(--naranja); padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { color: #fff; font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
  header span { color: rgba(255,255,255,0.8); font-size: 12px; font-weight: 400; }

  .tabs { display: flex; gap: 0; padding: 0 32px; border-bottom: 1.5px solid #eee; background: #fff; position: sticky; top: 0; z-index: 10; }
  .tab { padding: 14px 20px; font-size: 12px; font-weight: 600; color: #888; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; letter-spacing: 0.5px; text-transform: uppercase; }
  .tab.active { color: var(--naranja); border-bottom-color: var(--naranja); }
  .tab:hover { color: var(--naranja); }

  .section { display: none; padding: 24px 32px; }
  .section.active { display: block; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

  .card { background: #fff; border: 0.5px solid #e8e8e8; border-radius: 12px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }

  .card-preview { height: 160px; background: var(--gris-claro); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .card-preview img { width: 100%; height: 100%; object-fit: cover; }
  .card-preview .no-img { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; background: linear-gradient(135deg, #fff8f3 0%, #ffe8d6 100%); }
  .card-preview .post-text { font-size: 11px; color: #666; text-align: center; padding: 16px; line-height: 1.5; max-height: 100%; overflow: hidden; }
  .platform-tag { position: absolute; top: 10px; right: 10px; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px; letter-spacing: 0.5px; }
  .tag-li { background: #e8f0fb; color: #1a56a0; }
  .tag-ig { background: #fde8f0; color: #b5154e; }
  .tag-sub { background: #fff0e0; color: #b85400; }

  .card-body { padding: 14px 16px; }
  .card-title { font-size: 13px; font-weight: 700; color: var(--gris-oscuro); margin-bottom: 4px; line-height: 1.4; }
  .card-date { font-size: 11px; color: #999; margin-bottom: 12px; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .metric { text-align: center; }
  .metric-val { font-size: 16px; font-weight: 700; color: var(--naranja); line-height: 1; }
  .metric-label { font-size: 9px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .card-link { display: block; text-align: center; font-size: 11px; font-weight: 600; color: var(--naranja); text-decoration: none; padding: 7px; border: 1px solid #ffe0c2; border-radius: 6px; transition: background 0.2s; }
  .card-link:hover { background: #fff3eb; }

  .summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .kpi { background: var(--gris-claro); border-radius: 10px; padding: 14px 16px; }
  .kpi-val { font-size: 22px; font-weight: 800; color: var(--naranja); }
  .kpi-label { font-size: 11px; color: #888; margin-top: 3px; }

  .section-title { font-size: 13px; font-weight: 700; color: var(--naranja); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
</style>
</head>
<body>

<div class="tabs">

function cardLI(p) {
  return `<div class="card">
    <div class="card-preview">
      <div class="no-img"><div class="post-text">${p.titulo}</div></div>
      <span class="platform-tag tag-li">LinkedIn Propel</span>
    </div>
    <div class="card-body">
      <div class="card-title">${p.titulo}</div>
      <div class="card-date">${p.fecha}</div>
      <div class="metrics">
        <div class="metric"><div class="metric-val">${p.impresiones.toLocaleString()}</div><div class="metric-label">Impresiones</div></div>
        <div class="metric"><div class="metric-val">${p.clics}</div><div class="metric-label">Clics</div></div>
        <div class="metric"><div class="metric-val">${p.tasa}%</div><div class="metric-label">Interacción</div></div>
      </div>
      <a href="${p.url}" target="_blank" class="card-link">Ver post →</a>
    </div>
  </div>`;
}

function cardIG(p) {
  return `<div class="card">
    <div class="card-preview">
      <div class="no-img"><div class="post-text">${p.titulo}</div></div>
      <span class="platform-tag tag-ig">Instagram</span>
    </div>
    <div class="card-body">
      <div class="card-title">${p.titulo}</div>
      <div class="card-date">${p.fecha}</div>
      <div class="metrics">
        <div class="metric"><div class="metric-val">${p.alcance}</div><div class="metric-label">Alcance</div></div>
        <div class="metric"><div class="metric-val">${p.likes}</div><div class="metric-label">Likes</div></div>
        <div class="metric"><div class="metric-val">${p.guardados}</div><div class="metric-label">Guardados</div></div>
      </div>
      <a href="${p.url}" target="_blank" class="card-link">Ver post →</a>
    </div>
  </div>`;
}

function cardPersonal(p, platform, tagClass) {
  return `<div class="card">
    <div class="card-preview">
      <div class="no-img"><div class="post-text">${p.titulo}</div></div>
      <span class="platform-tag ${tagClass}">${platform}</span>
    </div>
    <div class="card-body">
      <div class="card-title">${p.titulo}</div>
      <div class="card-date">${p.fecha}</div>
      <div class="metrics">
        <div class="metric"><div class="metric-val">${p.likes}</div><div class="metric-label">Likes</div></div>
        <div class="metric"><div class="metric-val">${p.comentarios}</div><div class="metric-label">Comentarios</div></div>
        <div class="metric"><div class="metric-val">${p.total}</div><div class="metric-label">Total</div></div>
      </div>
      <a href="${p.url}" target="_blank" class="card-link">Ver post →</a>
    </div>
  </div>`;
}

function kpis(label, val) {
  return `<div class="kpi"><div class="kpi-val">${val}</div><div class="kpi-label">${label}</div></div>`;
}

function summaryLI(posts, el) {
  const totalImp = posts.reduce((a,p) => a + p.impresiones, 0);
  const totalClics = posts.reduce((a,p) => a + p.clics, 0);
  const avgTasa = (posts.reduce((a,p) => a + p.tasa, 0) / posts.length).toFixed(1);
  el.innerHTML = kpis('Posts', posts.length) + kpis('Impresiones totales', totalImp.toLocaleString()) + kpis('Clics totales', totalClics) + kpis('% Interacción prom.', avgTasa + '%');
}

function summaryIG(posts, el) {
  const totalAlcance = posts.reduce((a,p) => a + p.alcance, 0);
  const totalLikes = posts.reduce((a,p) => a + p.likes, 0);
  const totalGuardados = posts.reduce((a,p) => a + p.guardados, 0);
  el.innerHTML = kpis('Posts', posts.length) + kpis('Alcance total', totalAlcance.toLocaleString()) + kpis('Likes totales', totalLikes) + kpis('Guardados totales', totalGuardados);
}

function summaryPersonal(posts, el) {
  const total = posts.reduce((a,p) => a + p.total, 0);
  const top = posts.reduce((a,p) => p.total > a.total ? p : a, posts[0]);
  el.innerHTML = kpis('Posts', posts.length) + kpis('Interacciones totales', total) + kpis('Top post', top.titulo.split('—')[0].trim());
}

// Render LI
document.getElementById('grid-li').innerHTML = data.li.map(cardLI).join('');
summaryLI(data.li, document.getElementById('summary-li'));

// Render IG
document.getElementById('grid-ig').innerHTML = data.ig.map(cardIG).join('');
summaryIG(data.ig, document.getElementById('summary-ig'));

// Render Clau
document.getElementById('grid-clau').innerHTML = data.clau.map(p => cardPersonal(p, 'Clau LinkedIn', 'tag-li')).join('');
summaryPersonal(data.clau, document.getElementById('summary-clau'));

// Render Mafe

summaryPersonal(data.mafe, document.getElementById('summary-mafe'));

// Render Todos
const allCards = [
  ...data.li.map(cardLI),
  ...data.ig.map(cardIG),
  ...data.clau.map(p => cardPersonal(p, 'Clau LinkedIn', 'tag-li')),
  ...data.mafe.map(p => cardPersonal(p, 'Mafe LinkedIn', 'tag-li'))
];
document.getElementById('grid-todos').innerHTML = allCards.join('');
const totalPosts = data.li.length + data.ig.length + data.clau.length + data.mafe.length;
document.getElementById('summary-todos').innerHTML = kpis('Posts totales', totalPosts) + kpis('Plataformas', 3) + kpis('Mejor LI Propel', 'Liderar con intención') + kpis('Mejor Instagram', 'Deja de correr atrás de la IA');

function showTab(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}
</script>

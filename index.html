<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impulso — Galería de Posts</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --naranja: #ff7903; --gris: #f7f7f5; --borde: #ebebeb; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Libre Franklin', sans-serif; background: #fff; color: #1a1a1a; font-size: 13px; }

  header { background: var(--naranja); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { color: #fff; font-size: 15px; font-weight: 800; letter-spacing: -0.2px; }
  header span { color: rgba(255,255,255,0.75); font-size: 11px; }

  .tabs { display: flex; padding: 0 24px; border-bottom: 1px solid var(--borde); background: #fff; position: sticky; top: 0; z-index: 10; }
  .tab { padding: 11px 16px; font-size: 11px; font-weight: 600; color: #aaa; cursor: pointer; border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
  .tab.active { color: var(--naranja); border-bottom-color: var(--naranja); }

  .section { display: none; padding: 16px 24px; }
  .section.active { display: block; }

  /* Vista resumen — una fila por post */
  .post-list { display: flex; flex-direction: column; gap: 8px; }
  .post-row { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--borde); border-radius: 10px; padding: 10px 14px; transition: box-shadow 0.15s; }
  .post-row:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .post-thumb { width: 56px; height: 56px; border-radius: 7px; object-fit: cover; background: var(--gris); flex-shrink: 0; }
  .post-info { min-width: 0; }
  .post-title { font-size: 12px; font-weight: 700; color: #1a1a1a; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .post-meta { display: flex; align-items: center; gap: 8px; }
  .post-date { font-size: 10px; color: #aaa; }
  .ptag { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 10px; letter-spacing: 0.3px; }
  .pli { background: #e8f0fb; color: #1a56a0; }
  .pig { background: #fde8f0; color: #b5154e; }
  .post-metrics { display: flex; gap: 16px; align-items: center; flex-shrink: 0; }
  .metric { text-align: right; }
  .metric-val { font-size: 13px; font-weight: 700; color: var(--naranja); line-height: 1; }
  .metric-lbl { font-size: 9px; color: #bbb; text-transform: uppercase; margin-top: 1px; }
  .post-link { font-size: 10px; font-weight: 600; color: var(--naranja); text-decoration: none; white-space: nowrap; padding: 5px 10px; border: 1px solid #ffe0c2; border-radius: 6px; }
  .post-link:hover { background: #fff3eb; }

  /* KPIs resumen */
  .summary { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .kpi { background: var(--gris); border-radius: 8px; padding: 10px 14px; min-width: 100px; }
  .kpi-val { font-size: 18px; font-weight: 800; color: var(--naranja); line-height: 1; }
  .kpi-lbl { font-size: 10px; color: #888; margin-top: 2px; }

  .sec-label { font-size: 10px; font-weight: 700; color: var(--naranja); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="tabs">

function row(p) {
  return `<div class="post-row">
    <img class="post-thumb" src="${p.img}" alt="${p.titulo}" onerror="this.style.background='#ffe8d6'">
    <div class="post-info">
      <div class="post-title">${p.titulo}</div>
      <div class="post-meta">
        <span class="post-date">${p.fecha}</span>
        <span class="ptag ${p.tag}">${p.plat}</span>
      </div>
    </div>
    <div class="post-metrics">
      <div class="metric"><div class="metric-val">${typeof p.m1==='number'?p.m1.toLocaleString():p.m1}</div><div class="metric-lbl">${p.l1}</div></div>
      <div class="metric"><div class="metric-val">${p.m2}</div><div class="metric-lbl">${p.l2}</div></div>
      <div class="metric"><div class="metric-val">${p.m3}</div><div class="metric-lbl">${p.l3}</div></div>
      <a href="${p.url}" target="_blank" class="post-link">Ver →</a>
    </div>
  </div>`;
}

function kpi(label,val) { return `<div class="kpi"><div class="kpi-val">${val}</div><div class="kpi-lbl">${label}</div></div>`; }

function render(gId,sId,data,sumHtml) {
  document.getElementById(gId).innerHTML = data.map(row).join('');
  document.getElementById(sId).innerHTML = sumHtml;
}

render('grid-li','sum-li', posts.li,
  kpi('Posts',posts.li.length)+kpi('Impresiones',posts.li.reduce((a,p)=>a+p.m1,0).toLocaleString())+kpi('Clics',posts.li.reduce((a,p)=>a+p.m2,0))+kpi('% Inter. prom.',(posts.li.reduce((a,p)=>a+parseFloat(p.m3),0)/posts.li.length).toFixed(1)+'%'));
render('grid-ig','sum-ig', posts.ig,
  kpi('Posts',posts.ig.length)+kpi('Alcance total',posts.ig.reduce((a,p)=>a+p.m1,0).toLocaleString())+kpi('Likes',posts.ig.reduce((a,p)=>a+p.m2,0))+kpi('Guardados',posts.ig.reduce((a,p)=>a+p.m3,0)));
render('grid-clau','sum-clau', posts.clau,
  kpi('Posts',posts.clau.length)+kpi('Interacciones',posts.clau.reduce((a,p)=>a+p.m3,0))+kpi('Top post','Lanzamos Impulso'));
render('grid-mafe','sum-mafe', posts.mafe,
  kpi('Posts',posts.mafe.length)+kpi('Interacciones',posts.mafe.reduce((a,p)=>a+p.m3,0))+kpi('Top post','No puedes hacerlo todo'));

// Resumen: solo posts únicos (sin duplicados entre plataformas)
const uniqueTitles = new Set();
const uniquePosts = [...posts.li,...posts.ig,...posts.clau,...posts.mafe].filter(p => {
  const key = p.titulo.split('—')[0].trim().toLowerCase();
  if(uniqueTitles.has(key)) return false;
  uniqueTitles.add(key); return true;
});
render('grid-todos','sum-todos', uniquePosts,
  kpi('Blogs publicados',uniquePosts.length)+kpi('Plataformas',3)+kpi('Mejor LI Propel','Liderar con intención')+kpi('Mejor Instagram','Deja de correr atrás de la IA'));

function showTab(id,el) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
}

<style>
  :root { --naranja: #ff7903; --borde: #ebebeb; --gris: #f7f7f5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Libre Franklin', sans-serif; background: #fff; color: #1a1a1a; }
  header { background: var(--naranja); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { color: #fff; font-size: 15px; font-weight: 300; }
  header span { color: rgba(255,255,255,0.75); font-size: 11px; font-weight: 300; }
  .tabs { display: flex; overflow-x: auto; padding: 0 20px; border-bottom: 1px solid var(--borde); background: #fff; position: sticky; top: 0; z-index: 10; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 11px 14px; font-size: 11px; font-weight: 500; color: #aaa; cursor: pointer; border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; flex-shrink: 0; }
  .tab.active { color: var(--naranja); border-bottom-color: var(--naranja); }
  .section { display: none; padding: 16px 20px; max-width: 1000px; margin: 0 auto; }
  .section.active { display: block; }
  .summary { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .kpi { background: var(--gris); border-radius: 8px; padding: 10px 14px; }
  .kpi-val { font-size: 17px; font-weight: 300; color: var(--naranja); line-height: 1; }
  .kpi-lbl { font-size: 10px; color: #888; margin-top: 3px; }
  .sec-label { font-size: 10px; font-weight: 500; color: var(--naranja); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 220px)); gap: 12px; justify-content: start; }
  @media (max-width: 700px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card { border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; background: #fff; max-width: 220px; }
  .card-img { width: 100%; aspect-ratio: 1 / 1; overflow: hidden; background: #f0f0ee; position: relative; }
  .card-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .ptag { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
  .ptag svg { width: 14px; height: 14px; fill: rgba(255,255,255,0.9); filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4)); }
  .card-body { padding: 6px 8px; }
  .card-title { font-size: 9px; font-weight: 400; color: #1a1a1a; line-height: 1.4; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-date { font-size: 9px; color: #bbb; margin-bottom: 5px; }
  .card-metrics { display: flex; gap: 0; border-top: 1px solid var(--borde); padding-top: 5px; margin-top: 3px; }
  .met { flex: 1; text-align: center; }
  .met + .met { border-left: 1px solid var(--borde); }
  .met-val { font-size: 11px; font-weight: 300; color: var(--naranja); }
  .met-lbl { font-size: 8px; color: #bbb; text-transform: uppercase; margin-top: 1px; }
  .card-insight { font-size: 9px; color: #888; font-style: italic; padding: 5px 8px; border-top: 1px solid var(--borde); line-height: 1.4; }
  .card-insight span { color: var(--naranja); }
  .card-link { display: block; text-align: center; font-size: 9px; font-weight: 500; color: var(--naranja); text-decoration: none; padding: 5px; border-top: 1px solid var(--borde); margin-top: 5px; }
  .card-link:hover { background: #fff8f3; }
</style>

function card(p) {
  var icon = p.tag === 'pli' ? LI_SVG : IG_SVG;
  var insight = p.insight ? '<div class="card-insight">💡 ' + p.insight + '</div>' : '';
  var m0 = typeof p.m[0] === 'number' ? p.m[0].toLocaleString() : p.m[0];
  return '<div class="card">' +
    '<div class="card-img">' +
      '<img src="' + p.img + '" alt="' + p.titulo + '" onerror="this.style.background=\'#ffe8d6\'">' +
      '<span class="ptag">' + icon + '</span>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-title">' + p.titulo + '</div>' +
      '<div class="card-date">' + p.fecha + '</div>' +
      '<div class="card-metrics">' +
        '<div class="met"><div class="met-val">' + m0 + '</div><div class="met-lbl">' + p.l[0] + '</div></div>' +
        '<div class="met"><div class="met-val">' + p.m[1] + '</div><div class="met-lbl">' + p.l[1] + '</div></div>' +
        '<div class="met"><div class="met-val">' + p.m[2] + '</div><div class="met-lbl">' + p.l[2] + '</div></div>' +
      '</div>' +
      insight +
      '<a href="' + p.url + '" target="_blank" class="card-link">Ver post →</a>' +
    '</div>' +
  '</div>';
}

function kpi(label, val) {
  return '<div class="kpi"><div class="kpi-val">' + val + '</div><div class="kpi-lbl">' + label + '</div></div>';
}

function render(gId, sId, data, sumHtml) {
  document.getElementById(gId).innerHTML = data.map(card).join('');
  document.getElementById(sId).innerHTML = sumHtml;
}

render('grid-li', 'sum-li', posts.li,
  kpi('Posts', posts.li.length) + kpi('Impresiones', posts.li.reduce(function(a,p){return a+p.m[0];},0).toLocaleString()) + kpi('Clics', posts.li.reduce(function(a,p){return a+p.m[1];},0)));
render('grid-ig', 'sum-ig', posts.ig,
  kpi('Posts', posts.ig.length) + kpi('Alcance', posts.ig.reduce(function(a,p){return a+p.m[0];},0).toLocaleString()) + kpi('Likes', posts.ig.reduce(function(a,p){return a+p.m[1];},0)));

render('grid-mafe', 'sum-mafe', posts.mafe,
  kpi('Posts', posts.mafe.length) + kpi('Interacciones', posts.mafe.reduce(function(a,p){return a+p.m[2];},0)));

function showTab(id, el) {
  document.querySelectorAll('.section').forEach(function(s){ s.classList.remove('active'); });
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
}
